name: prepcivic_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Tools
  cupertino_icons: ^1.0.8
  introduction_screen: ^3.1.12 # Using a stable version often fixes conflicts
  google_fonts: ^6.1.0 
  provider: ^6.1.5
  
  # Data & Logic Tools
  shared_preferences: ^2.2.2 
  sqflite: ^2.3.0          
  path: ^1.9.0             
  csv: ^6.0.0              
  crypto: ^3.0.3           
  encrypt: ^5.0.3          # <--- THIS WAS MISSING! Adding it back.
  path_provider: ^2.1.2    
  intl: ^0.20.2            
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  easy_localization: ^3.0.8
  purchases_flutter: ^10.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/fr/
    - assets/ar/
    - assets/bn/
    - assets/ur/
    - assets/ps/
    - assets/en/
    - assets/translations/
    - assets/mock_test/
